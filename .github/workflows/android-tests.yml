name: Android Appium Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Даем права на аппаратное ускорение (KVM)
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium
          appium -v

      - name: Install UiAutomator2 driver
        run: |
          appium driver install uiautomator2

      - name: Start Appium server
        run: |
          nohup appium --log-level info > appium.log 2>&1 &
          sleep 5
          cat appium.log

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Запуск эмулятора + ожидание загрузки + запуск тестов
      - name: Run Android emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: true
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none"
          script: |
            ADB=/usr/local/lib/android/sdk/platform-tools/adb
            EMU=emulator-5554
            TIMEOUT=300

            echo "Restarting adb..."
            $ADB kill-server || true
            $ADB start-server

            echo "Waiting for $EMU to appear as 'device'..."
            elapsed=0
            until $ADB devices | grep -w "$EMU" | grep -q device; do
              sleep 5
              elapsed=$((elapsed+5))
              if [ $elapsed -gt $TIMEOUT ]; then
                echo "Emulator not online after ${TIMEOUT}s"
                exit 1
              fi
            done

            echo "Waiting for boot completion..."
            elapsed=0
            until [ "$($ADB -s $EMU shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 5
              elapsed=$((elapsed+5))
              if [ $elapsed -gt $TIMEOUT ]; then
                echo "Boot not completed after ${TIMEOUT}s"
                exit 1
              fi
            done

            echo "Emulator is ready."

            ./gradlew test --info

      # Сохранение логов и скриншота при падении
      - name: Save device logs and screenshot
        if: failure()
        run: |
          mkdir -p artifacts
          ADB=/usr/local/lib/android/sdk/platform-tools/adb
          EMU=emulator-5554

          echo "Collecting logcat..."
          $ADB -s $EMU logcat -d > artifacts/logcat.txt || true

          echo "Collecting device screenshot..."
          $ADB -s $EMU exec-out screencap -p > artifacts/screenshot.png || true

      - name: Upload Android artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts
