name: Android Appium Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # 1. Используем 22.04 во избежание багов с путями эмулятора
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ВАЖНО: Даем права на аппаратное ускорение (KVM)
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium
          appium -v

      - name: Install UiAutomator2 driver
        run: |
          appium driver install uiautomator2

      # 3. Перенаправляем логи в файл и даем серверу 5 секунд на запуск
      - name: Start Appium server
        run: |
          nohup appium --log-level info > appium.log 2>&1 &
          sleep 5
          cat appium.log

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          # 4. Используем базовый профиль
          profile: pixel
          force-avd-creation: true
          disable-animations: true
          # Добавлены параметры отключения камер для экономии оперативной памяти раннера
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none"
          script: ./gradlew test --info